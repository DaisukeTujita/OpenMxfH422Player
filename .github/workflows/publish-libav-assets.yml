name: Verify or publish custom libav.js assets

on:
  pull_request:
    paths:
      - ".github/workflows/publish-libav-assets.yml"
      - "libav/**"
      - "scripts/build-libav-h422.mjs"
      - "scripts/build-libav-h422.sh"
      - "scripts/compare-libav-assets.mjs"
      - "scripts/inspect-wasm-reproducibility.mjs"
      - "scripts/verify-release-assets.mjs"
  workflow_dispatch:
    inputs:
      operation:
        description: Verify the assets, or publish them from main after verification
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish

permissions:
  contents: read

env:
  RELEASE_TAG: v6.10.9.0-h422.1

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "3.1.74"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Clean build 1
        env:
          LIBAVJS_SOURCE: ${{ runner.temp }}/libav-build-one/source
        run: |
          npm run build:libav
          mv libav/dist libav/build-one

      - name: Clean build 2 (different absolute source path)
        env:
          LIBAVJS_SOURCE: ${{ runner.temp }}/libav-build-two/source
        run: npm run build:libav

      - name: Compare all three outputs byte-for-byte and by SHA-256
        run: node scripts/compare-libav-assets.mjs libav/build-one libav/dist

      - name: Inspect WASM custom sections and absolute paths
        run: |
          node scripts/inspect-wasm-reproducibility.mjs libav/build-one/libav-6.10.9.0-h422.wasm.wasm
          node scripts/inspect-wasm-reproducibility.mjs libav/dist/libav-6.10.9.0-h422.wasm.wasm

      - name: Match all outputs against libav/assets.json
        run: |
          node scripts/verify-release-assets.mjs libav/build-one
          node scripts/verify-release-assets.mjs libav/dist

      - name: Preserve the verified release assets
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-libav-assets
          path: libav/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          if [ "$visibility" != public ]; then
            echo "Release assets must be anonymously downloadable, but repository visibility is: $visibility" >&2
            echo "Make the repository public or publish the assets from a separate public repository/storage." >&2
            exit 1
          fi

      - name: Refuse to modify an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to mix or replace assets." >&2
            exit 1
          fi

      - name: Download the assets produced by the verification job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-libav-assets
          path: libav/dist

      - name: Recheck downloaded assets against libav/assets.json
        run: node scripts/verify-release-assets.mjs

      - name: Create release with exactly three assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            libav/dist/libav-h422.mjs \
            libav/dist/libav-6.10.9.0-h422.wasm.mjs \
            libav/dist/libav-6.10.9.0-h422.wasm.wasm \
            --repo "$GITHUB_REPOSITORY" \
            --title "Custom libav.js $RELEASE_TAG" \
            --notes "OpenMxfH422Player custom MXF/MPEG-2/PCM libav.js runtime."

      - name: Verify published URLs and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published-assets
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("libav/assets.json", "utf8"));
          for (const asset of manifest.assets) {
            const url = `${manifest.baseUrl}/${asset.name}`;
            let response;
            for (let attempt = 1; attempt <= 12; attempt++) {
              response = await fetch(url, { redirect: "follow" });
              if (response.status === 200) break;
              if (attempt === 12) throw new Error(`${url}: HTTP ${response.status}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            const data = Buffer.from(await response.arrayBuffer());
            await writeFile(`published-assets/${asset.name}`, data);
            console.log(`HTTP 200 ${url}`);
          }
          EOF
          node scripts/verify-release-assets.mjs published-assets
